<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo</title><meta name="robots" content="noindex">
<style>
:root{--c:#ff7a1a;--bg:#f6f7f9;--card:#fff;--txt:#17202a;--mut:#667;--line:#e5e8ec}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171d24;--txt:#eef2f6;--mut:#9aa7b4;--line:#28313b}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
.hero{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;padding:34px 18px 60px;text-align:center}
.lg{width:92px;height:92px;border-radius:22px;object-fit:cover;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);margin-bottom:12px}
h1{margin:0;font-size:26px}.sl{opacity:.92;margin-top:4px}.ct{opacity:.85;font-size:14px;margin-top:4px}
.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.links a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:rgba(255,255,255,.18);padding:8px 14px;border-radius:99px}
main{max-width:1100px;margin:-36px auto 0;padding:0 14px 30px}
.tt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:14px;font-weight:800;font-size:18px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.p .im{aspect-ratio:1;background:color-mix(in srgb,var(--c) 10%,var(--card));display:grid;place-items:center;font-size:46px}.p .im img{width:100%;height:100%;object-fit:cover}
.p .b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.p h3{margin:0;font-size:16px}.p .d{font-size:13px;color:var(--mut)}
.pr{font-size:20px;font-weight:900;color:var(--c)}.fx{font-size:12.5px;color:var(--mut)}.fx b{color:var(--txt)}
.wa{margin-top:auto;display:block;text-align:center;background:#25d366;color:#fff;text-decoration:none;font-weight:800;border-radius:12px;padding:10px}
footer{text-align:center;font-size:12.5px;color:var(--mut);padding:10px 14px 30px;line-height:1.6}footer a{color:var(--c);font-weight:700;text-decoration:none}
.err{max-width:520px;margin:60px auto;text-align:center;padding:20px}
</style></head><body><div id="app"><div class="err">Carregando catálogo…</div></div>
<script>
(async function(){const A=document.getElementById('app'),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
 let C=window.__CAT||null;
 if(!C){const h=location.hash.slice(1);if(!h){A.innerHTML='<div class="err"><h2>Catálogo não encontrado</h2><p>Peça o link completo para a loja.</p></div>';return;}
  try{const b=atob(h.replace(/-/g,'+').replace(/_/g,'/'));const u=Uint8Array.from(b,c=>c.charCodeAt(0));
   const ds=new DecompressionStream('deflate-raw');const t=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();C=JSON.parse(t);}
  catch(e){A.innerHTML='<div class="err"><h2>Não consegui abrir este catálogo</h2><p>O link pode ter sido cortado ao copiar. Peça o link de novo para a loja, ou abra em outro navegador.</p></div>';return;}}
 const L=C.l||{};if(L.cor)document.documentElement.style.setProperty('--c',L.cor);document.title=(L.n||'Catálogo')+' – Catálogo';
 const wn=String(L.w||'').replace(/\D/g,''),wnum=wn?(wn.length<=11?'55'+wn:wn):'';
 const wl=t=>wnum?`https://wa.me/${wnum}?text=${encodeURIComponent(t)}`:'';
 const ig=String(L.i||'').replace(/^@/,'').trim();
 A.innerHTML=`<div class="hero">${L.lg?`<img class="lg" src="${L.lg}" alt="">`:''}<h1>${E(L.n||'Catálogo')}</h1>${L.s?`<div class="sl">${E(L.s)}</div>`:''}${L.c?`<div class="ct">📍 ${E(L.c)}</div>`:''}
  <div class="links">${wnum?`<a href="${wl('Olá! Vi o catálogo e quero fazer um pedido.')}" target="_blank" rel="noopener">💬 WhatsApp</a>`:''}${ig?`<a href="https://instagram.com/${encodeURIComponent(ig)}" target="_blank" rel="noopener">📸 @${E(ig)}</a>`:''}</div></div>
  <main>${C.t?`<div class="tt">${E(C.t)}</div>`:''}<div class="grid">${(C.p||[]).map(p=>{const fx=(p.fx||[]).filter(f=>f.q>0&&f.p>0).sort((a,b)=>a.q-b.q);
   return `<div class="p"><div class="im">${p.f?`<img src="${p.f}" alt="${E(p.n)}" loading="lazy">`:'🧩'}</div><div class="b"><h3>${E(p.n)}</h3>${p.d?`<div class="d">${E(p.d)}</div>`:''}
   <div class="pr">${brl(p.pr)}</div>${C.fx&&fx.length?`<div class="fx">${fx.map(f=>`A partir de <b>${f.q} un.</b>: ${brl(f.p)} cada`).join('<br>')}</div>`:''}
   ${wnum?`<a class="wa" href="${wl('Olá! Quero: '+p.n+' ('+brl(p.pr)+')')}" target="_blank" rel="noopener">Pedir no WhatsApp</a>`:''}</div></div>`;}).join('')}</div></main>
  <footer>Preços sujeitos a alteração. Fale com a loja para confirmar.<br>🔒 Este catálogo não fica guardado em nenhum servidor: as informações estão no próprio link ou no site da loja.<br>⚡ Feito com <a href="https://pablosousathe-dot.github.io/calculadora-3d/" target="_blank" rel="noopener">Lucra3D</a></footer>`;})();
</script></body></html>
